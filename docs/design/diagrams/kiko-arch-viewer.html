<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Kiko Architecture Diagram</title>
<style>
  body { margin: 0; background: #f5f5f5; overflow: hidden; }
  #container { width: 100vw; height: 100vh; overflow: auto; }
  #diagram { transform-origin: top left; transition: transform 0.2s; }
  .controls { position: fixed; top: 10px; right: 10px; z-index: 100; background: white; padding: 8px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .controls button { margin: 2px; padding: 6px 12px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div class="controls">
  <button onclick="zoom(1.2)">+</button>
  <button onclick="zoom(0.8)">-</button>
  <button onclick="reset()">Reset</button>
</div>
<div id="container">
  <div id="diagram">
    <!-- SVG will be loaded here -->
  </div>
</div>
<script>
  let scale = 1;
  function zoom(factor) { scale *= factor; apply(); }
  function reset() { scale = 1; apply(); }
  function apply() { document.getElementById('diagram').style.transform = 'scale(' + scale + ')'; }
  fetch('kiko-arch-large.svg').then(r => r.text()).then(svg => {
    document.getElementById('diagram').innerHTML = svg;
  });
</script>
</body>
</html>
