# kb/config.yaml — NVIDIA build.nvidia.com free-endpoint models
# LiteLLM-compatible model list.
# Verified working against https://integrate.api.nvidia.com/v1/chat/completions
# Source: tools/robota.py scrape of https://build.nvidia.com/models (pages 1-5)
#
# IMPORTANT: no hardcoded API keys here.  Set NVIDIA_API_KEY in your environment
# or KWallet (nvidia/personal/api_key) before using.

model_list:
  - model_name: mistral-large-4-1t-a52b
    litellm_params:
      model: openai/mistralai/mistral-large-4-1t-a52b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: "$NVIDIA_API_KEY"
      drop_params: true

